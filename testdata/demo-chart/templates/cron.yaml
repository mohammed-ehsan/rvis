apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-report
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      parallelism: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: ghcr.io/acme/shop-report:2.3.1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  ports: [{ port: 80 }]
  selector: { app: frontend }
