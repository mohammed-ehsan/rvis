name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The edit tests render charts with the real helm binary.
      - uses: azure/setup-helm@v4
      - run: make lint
      - run: make test
      - run: make build
